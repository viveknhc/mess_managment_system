    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; }

    .container { max-width: 900px; margin: 0 auto; padding: 32px 16px; }

    /* Header */
    .header { margin-bottom: 32px; }
    .header h1 { font-size: 24px; font-weight: 700; }
    .header p { font-size: 13px; color: #64748b; margin-top: 4px; }

    /* Overall stats card */
    .stats-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin-bottom: 32px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .stats-top { display: flex; justify-content: space-between; align-items: flex-end; }
    .stats-label { font-size: 13px; color: #64748b; font-weight: 500; }
    .stats-pct { font-size: 36px; font-weight: 800; color: #0f172a; margin-top: 2px; }
    .stats-count { font-size: 13px; color: #64748b; }

    /* Overall progress bar */
    .progress-overall { height: 12px; background: #e2e8f0; border-radius: 8px; margin-top: 16px; overflow: hidden; }
    .progress-overall-fill { height: 100%; border-radius: 8px; transition: width .7s; }

    /* Summary chips */
    .chips { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .chip { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; }
    .chip-dot { width: 10px; height: 10px; border-radius: 50%; }
    .chip-completed { background: #ecfdf5; color: #047857; }
    .chip-completed .chip-dot { background: #10b981; }
    .chip-progress { background: #fffbeb; color: #b45309; }
    .chip-progress .chip-dot { background: #f59e0b; }
    .chip-notstarted { background: #f1f5f9; color: #475569; }
    .chip-notstarted .chip-dot { background: #94a3b8; }

    /* Module card */
    .module { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.03); transition: box-shadow .2s; }
    .module:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .module.completed { border-color: #a7f3d0; }
    .module.in_progress { border-color: #fde68a; }

    .module-header { display: flex; align-items: flex-start; gap: 14px; padding: 18px 20px; cursor: pointer; user-select: none; }

    /* Module number circle */
    .module-num { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
    .module.completed .module-num { background: #d1fae5; color: #047857; }
    .module.in_progress .module-num { background: #fef3c7; color: #b45309; }
    .module.not_started .module-num { background: #f1f5f9; color: #94a3b8; }

    .module-body { flex: 1; min-width: 0; }
    .module-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .module-name { font-size: 14px; font-weight: 600; color: #0f172a; }
    .module-desc { font-size: 12px; color: #64748b; margin-top: 3px; }

    /* Status badge */
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; }
    .badge-completed { background: #ecfdf5; color: #047857; }
    .badge-completed .badge-dot { background: #10b981; }
    .badge-progress { background: #fffbeb; color: #b45309; }
    .badge-progress .badge-dot { background: #f59e0b; }
    .badge-notstarted { background: #f1f5f9; color: #64748b; }
    .badge-notstarted .badge-dot { background: #94a3b8; }

    /* Module progress bar */
    .module-progress { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .progress-bar { flex: 1; height: 6px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 4px; }
    .progress-fill.green { background: #10b981; }
    .progress-fill.amber { background: #f59e0b; }
    .progress-fill.gray { background: #cbd5e1; }
    .module-pct { font-size: 12px; font-weight: 500; color: #64748b; white-space: nowrap; }

    /* Expand arrow */
    .arrow { width: 18px; height: 18px; color: #94a3b8; transition: transform .2s; flex-shrink: 0; margin-top: 4px; }
    .module.expanded .arrow { transform: rotate(180deg); }

    /* Task list */
    .tasks { border-top: 1px solid #f1f5f9; padding: 12px 20px 16px; display: none; }
    .module.expanded .tasks { display: block; }
    .task { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
    .task-check { width: 18px; height: 18px; flex-shrink: 0; }
    .task-check.done { color: #10b981; }
    .task-circle { width: 18px; height: 18px; border: 2px solid #cbd5e1; border-radius: 50%; flex-shrink: 0; }
    .task-id { font-family: 'SF Mono', 'Consolas', monospace; font-size: 11px; color: #94a3b8; }
    .task-title { color: #334155; }
    .task-title.done { color: #94a3b8; text-decoration: line-through; }

    /* Milestone bar */
    .milestones { margin-bottom: 28px; }
    .milestones h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #475569; }
    .milestone-track { display: flex; gap: 2px; }
    .milestone-seg { flex: 1; height: 32px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #fff; position: relative; }
    .milestone-seg.done { background: #10b981; }
    .milestone-seg.current { background: #f59e0b; }
    .milestone-seg.pending { background: #e2e8f0; color: #94a3b8; }
    .milestone-label { position: absolute; top: 36px; font-size: 9px; color: #64748b; white-space: nowrap; font-weight: 500; }

    .footer { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 40px; padding-bottom: 20px; }
  </style>
</head>

        </div>
      </div>
    `;

    modules.forEach(m => {
      const pct = m.total > 0 ? Math.round((m.done / m.total) * 100) : 0;
      const numContent = m.status === "completed" ? tickSvg : m.id;
      const tasksHtml = m.tasks.map(t => `
        <div class="task">
          ${t.done ? `<span class="task-check done">${checkSvg}</span>` : `<span class="task-circle"></span>`}
          <span class="task-id">${t.id}</span>
          <span class="task-title ${t.done ? 'done' : ''}">${t.title}</span>
        </div>
      `).join('');

      html += `
        <div class="module ${m.status}" id="mod-${m.id}">
          <div class="module-header" onclick="toggle(${m.id})">
            <div class="module-num">${numContent}</div>
            <div class="module-body">
              <div class="module-title-row">
                <span class="module-name">${m.name}</span>
                <span class="badge ${badgeClass(m.status)}"><span class="badge-dot"></span>${badgeLabel(m.status)}</span>
              </div>
              <div class="module-desc">${m.desc}</div>
              <div class="module-progress">
                <div class="progress-bar"><div class="progress-fill ${fillClass(m.status)}" style="width:${pct}%"></div></div>
                <span class="module-pct">${m.done}/${m.total} (${pct}%)</span>
              </div>
            </div>
            ${arrowSvg}
          </div>
          <div class="tasks">${tasksHtml}</div>
        </div>
      `;
    });

    html += `<div class="footer">Source: docs/tasks.md &middot; ${totalTasks} tasks across ${modules.length} modules &middot; Last updated: ${new Date().toLocaleDateString()}</div>`;

    document.getElementById('app').innerHTML = html;

    function toggle(id) {
      const el = document.getElementById('mod-' + id);
      el.classList.toggle('expanded');
    }
  </script>
</body>
</html>
