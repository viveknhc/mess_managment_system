<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

    .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px 60px; }

    /* Header */
    .header { text-align: center; margin-bottom: 40px; }
    .header h1 { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .header p { font-size: 14px; color: #94a3b8; margin-top: 6px; }
    .header .stack { font-size: 12px; color: #64748b; margin-top: 4px; }

    /* Overall stats row */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; text-align: center; position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .stat-card.blue::before { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    .stat-card.green::before { background: linear-gradient(90deg, #10b981, #34d399); }
    .stat-card.amber::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .stat-card.rose::before { background: linear-gradient(90deg, #f43f5e, #fb7185); }
    .stat-value { font-size: 40px; font-weight: 800; line-height: 1; }
    .stat-card.blue .stat-value { color: #60a5fa; }
    .stat-card.green .stat-value { color: #34d399; }
    .stat-card.amber .stat-value { color: #fbbf24; }
    .stat-card.rose .stat-value { color: #fb7185; }
    .stat-label { font-size: 13px; color: #94a3b8; margin-top: 8px; font-weight: 500; }
    .stat-sub { font-size: 11px; color: #64748b; margin-top: 2px; }

    /* Progress ring */
    .ring-section { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; margin-bottom: 32px; display: flex; align-items: center; gap: 40px; }
    .ring-container { position: relative; width: 180px; height: 180px; flex-shrink: 0; }
    .ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: #334155; stroke-width: 12; }
    .ring-fill { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1.5s ease; }
    .ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ring-pct { font-size: 44px; font-weight: 800; color: #f8fafc; }
    .ring-label { font-size: 12px; color: #94a3b8; margin-top: 2px; }

    .ring-details { flex: 1; }
    .ring-details h2 { font-size: 20px; font-weight: 700; color: #f8fafc; margin-bottom: 16px; }
    .legend-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1e293b; }
    .legend-dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
    .legend-label { font-size: 14px; flex: 1; color: #cbd5e1; }
    .legend-count { font-size: 14px; font-weight: 700; color: #f8fafc; }
    .legend-bar { width: 120px; height: 6px; background: #334155; border-radius: 4px; overflow: hidden; }
    .legend-bar-fill { height: 100%; border-radius: 4px; }

    /* Timeline */
    .timeline-section { margin-bottom: 32px; }
    .timeline-section h2 { font-size: 16px; font-weight: 700; color: #f8fafc; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .timeline { display: flex; gap: 4px; align-items: stretch; }
    .timeline-seg { flex: 1; position: relative; }
    .timeline-bar { height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; transition: transform 0.2s, box-shadow 0.2s; cursor: default; }
    .timeline-bar:hover { transform: scaleY(1.15); }
    .timeline-bar.done { background: linear-gradient(135deg, #059669, #10b981); color: #d1fae5; }
    .timeline-bar.current { background: linear-gradient(135deg, #d97706, #f59e0b); color: #fef3c7; animation: pulse 2s infinite; }
    .timeline-bar.pending { background: #334155; color: #64748b; }
    .timeline-label { font-size: 9px; color: #64748b; text-align: center; margin-top: 6px; line-height: 1.2; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.3); } 50% { box-shadow: 0 0 12px 4px rgba(245, 158, 11, 0.15); } }

    /* Modules */
    .modules-section h2 { font-size: 16px; font-weight: 700; color: #f8fafc; margin-bottom: 16px; }
    .module { background: #1e293b; border: 1px solid #334155; border-radius: 14px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.3s, box-shadow 0.3s; }
    .module:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    .module.completed { border-color: #065f46; }
    .module.completed:hover { border-color: #10b981; }
    .module.not_started { border-color: #334155; }
    .module.not_started:hover { border-color: #64748b; }

    .module-header { display: flex; align-items: center; gap: 14px; padding: 16px 20px; cursor: pointer; user-select: none; }

    .module-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0; }
    .module.completed .module-icon { background: linear-gradient(135deg, #065f46, #059669); color: #d1fae5; }
    .module.not_started .module-icon { background: #334155; color: #64748b; }

    .module-body { flex: 1; min-width: 0; }
    .module-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .module-name { font-size: 15px; font-weight: 600; color: #f8fafc; }
    .module-desc { font-size: 12px; color: #64748b; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; }
    .badge-completed { background: #064e3b; color: #6ee7b7; }
    .badge-completed .badge-dot { background: #34d399; }
    .badge-notstarted { background: #1e293b; border: 1px solid #475569; color: #94a3b8; }
    .badge-notstarted .badge-dot { background: #64748b; }

    .module-progress { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .progress-bar { flex: 1; height: 5px; background: #334155; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.7s; }
    .progress-fill.green { background: linear-gradient(90deg, #059669, #34d399); }
    .progress-fill.gray { background: #64748b; }
    .module-pct { font-size: 12px; font-weight: 500; color: #94a3b8; white-space: nowrap; }

    .arrow { width: 18px; height: 18px; color: #64748b; transition: transform 0.25s; flex-shrink: 0; }
    .module.expanded .arrow { transform: rotate(180deg); color: #94a3b8; }

    /* Tasks */
    .tasks { border-top: 1px solid #293548; padding: 14px 20px 18px; display: none; background: #172033; }
    .module.expanded .tasks { display: block; }
    .task { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
    .task-check { width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .task-check.done svg { color: #34d399; }
    .task-circle { width: 18px; height: 18px; border: 2px solid #475569; border-radius: 50%; flex-shrink: 0; }
    .task-id { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 11px; color: #64748b; min-width: 48px; }
    .task-title { color: #cbd5e1; }
    .task-title.done { color: #64748b; text-decoration: line-through; text-decoration-color: #475569; }
    .task-pri { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: auto; flex-shrink: 0; }
    .task-pri.p0 { background: #7f1d1d; color: #fca5a5; }
    .task-pri.p1 { background: #78350f; color: #fcd34d; }
    .task-pri.p2 { background: #1e293b; color: #94a3b8; }

    /* Tech stack */
    .tech-section { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; margin-bottom: 32px; }
    .tech-section h2 { font-size: 16px; font-weight: 700; color: #f8fafc; margin-bottom: 16px; }
    .tech-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .tech-tag { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; text-align: center; font-size: 13px; font-weight: 600; color: #cbd5e1; transition: border-color 0.2s; }
    .tech-tag:hover { border-color: #60a5fa; }
    .tech-tag span { display: block; font-size: 10px; font-weight: 400; color: #64748b; margin-top: 2px; }

    /* What's next */
    .next-section { background: linear-gradient(135deg, #1e1b4b, #312e81); border: 1px solid #4338ca; border-radius: 16px; padding: 24px; margin-bottom: 32px; }
    .next-section h2 { font-size: 16px; font-weight: 700; color: #c7d2fe; margin-bottom: 12px; }
    .next-items { display: flex; flex-direction: column; gap: 8px; }
    .next-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: 10px; font-size: 14px; color: #e0e7ff; }
    .next-num { width: 28px; height: 28px; border-radius: 8px; background: #4338ca; color: #e0e7ff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex-shrink: 0; }

    /* Footer */
    .footer { text-align: center; font-size: 11px; color: #475569; padding: 20px 0; }
    .footer a { color: #60a5fa; text-decoration: none; }

    /* Responsive */
    @media (max-width: 768px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .ring-section { flex-direction: column; align-items: center; text-align: center; }
      .ring-container { width: 150px; height: 150px; }
      .ring-pct { font-size: 36px; }
      .legend-bar { width: 80px; }
      .timeline-bar { font-size: 8px; height: 34px; }
      .tech-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr 1fr; gap: 10px; }
      .stat-value { font-size: 30px; }
      .header h1 { font-size: 24px; }
    }
  </style>

          <div class="stat-sub">${totalDone} / ${totalTasks} tasks</div>

          <div class="stat-label">Tasks Completed</div>
          <div class="stat-sub">across all modules</div>
        </div>

    const offset = circumference - (overallPct / 100) * circumference;

    const backendModules = modules.filter(m => m.id <= 9);
    const frontendHeavy = modules.filter(m => m.id >= 10 && m.id <= 15);
    const finalModule = modules.filter(m => m.id >= 16);
    const backendDone = backendModules.reduce((s,m) => s + m.done, 0);
    const backendTotal = backendModules.reduce((s,m) => s + m.total, 0);
    const featureDone = frontendHeavy.reduce((s,m) => s + m.done, 0);
    const featureTotal = frontendHeavy.reduce((s,m) => s + m.total, 0);
    const finalDone = finalModule.reduce((s,m) => s + m.done, 0);
    const finalTotal = finalModule.reduce((s,m) => s + m.total, 0);

    html += `
      <div class="ring-section">
        <div class="ring-container">
