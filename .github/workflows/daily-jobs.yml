name: Daily jobs

# Runs the nightly jobs against the production database for hosts without Celery
# (Render free tier). Same job list as CELERY_BEAT_SCHEDULE: billing checks
# (overdue → suspended), subscription expiry, next-day deliveries, expiry alerts.
#
# Repo secrets: PROD_DATABASE_URL (Neon connection string), PROD_SECRET_KEY,
# and for alert emails EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD, DEFAULT_FROM_EMAIL.
# Skips quietly until PROD_DATABASE_URL is set.

on:
  schedule:
    - cron: "40 18 * * *" # 00:10 IST
  workflow_dispatch:

concurrency: daily-jobs

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
      DJANGO_SETTINGS_MODULE: config.settings.production
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
    steps:
      - name: Check configuration
        id: cfg
        working-directory: . # backend/ doesn't exist until checkout
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PROD_DATABASE_URL secret not set — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/production.txt
      - if: steps.cfg.outputs.skip != 'true'
        run: pip install -r requirements/production.txt
      - if: steps.cfg.outputs.skip != 'true'
        run: python manage.py run_daily_jobs
